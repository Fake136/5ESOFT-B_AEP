<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="content">
    <h2 class="mb-4">Painel do Gestor - Demandas</h2>

    <div class="card p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>Protocolo</th>
                    <th>Categoria</th>
                    <th>Localização</th>
                    <th>Prioridade</th>
                    <th>Status</th>
                    <th>Ação</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="sol : ${solicitacoes}">
                    <td><strong th:text="${sol.protocolo}"></strong></td>
                    <td th:text="${sol.categoria}"></td>
                    <td th:text="${sol.localizacao}"></td>
                    <td>
                            <span class="badge" th:text="${sol.prioridade}"
                                  th:class="${sol.prioridade == 'ALTA'} ? 'bg-danger' : 'bg-warning'">
                            </span>
                    </td>
                    <td>
                        <span class="badge bg-info" th:text="${sol.status}"></span>
                    </td>
                    <td>
                        <a th:href="@{/gestor/detalhes/{id}(id=${sol.id})}"
                           class="btn btn-sm btn-primary">Ver Detalhes</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${solicitacoes.isEmpty()}" class="alert alert-info text-center mt-4">
            Nenhuma solicitação registrada ainda.
        </div>
    </div>
</div>

</html>
